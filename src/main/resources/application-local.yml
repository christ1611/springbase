spring:
  application:
    name: springbase
    jmx:
    enabled: false
  main:
    lazy-initialization: false
  task:
    scheduling:
      enabled: true
  config:
    import:
#        - "optional:configserver:"
        - classpath:logs/logRuleConfig-local.yml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  messages:
    basename: i18n/exception
    fallback-to-system-locale: true
    encoding: UTF-8
  datasource:
    url: jdbc:oracle:thin:@localhost:1524
    username: admin
    password: admin
    type: oracle.ucp.jdbc.PoolDataSource
    oracleucp:
      connection-factory-class-name: oracle.jdbc.pool.OracleDataSource
      sql-for-validate-connection: select 1 from dual
      connection-pool-name: UcpPool
      initial-pool-size: 5
      min-pool-size: 5
      max-pool-size: 10
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jpa:
    show_sql: true
    open-in-view: true
    hibernate:
      ddl-auto: none  
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        show_sql: true                
        format_sql: true              
        use_sql_comments: true       
        jdbc:
          fetch_size: 250
  sleuth:
    enabled: true


# Logging Configuration
logging:
  level:
    root: info
    com.springbase: debug
    org:
      apache:
        kafka:
          clients:
            admin: error
      springframework: error
    org.hibernate.SQL: DEBUG                       # logs SQL statements
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE   # logs bind parameter values

biz:
  appName: LOS

minio:
  enable: true
  bucketName: logs
  minioUrl: http://localhost:9000
  accesskey: global
  secretkey: global
