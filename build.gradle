plugins {
    id 'java'
    id 'maven-publish'
    id "org.springframework.boot" version "${springBootVersion}"
    id "io.spring.dependency-management" version "${springDependencyVersion}"
}

group = 'com.springbase'
version = '0.0.1-SNAPSHOT'
description = 'core'

bootJar { enabled = true }
jar { enabled = true }

springBoot {
    mainClass = "com.springbase.core.Application"
}

compileTestJava.options.encoding = 'UTF-8'
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs = [ '-parameters' ]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

//nexus publish
publishing {
    repositories {
        maven {
            url "http://localhost:8081/repository/core-snapshot/"
            allowInsecureProtocol true
            credentials {
                username repoUsername
                password repoPassword
            }
        }
    }
    publications {
        maven(MavenPublication) {
            groupId = 'com.springbase'
            artifactId = 'core'
            from components.java
        }
    }
}

dependencies {
    /**  Springframework  **/
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation ('org.springframework.boot:spring-boot-starter-web') { exclude module: "spring-boot-starter-tomcat" }
    implementation ('org.springframework.boot:spring-boot-starter-undertow') { exclude group: 'io.undertow', module: 'undertow-websockets-jsr' }
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework:spring-oxm'

    /** LOMBOK **/
    implementation "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}", "org.projectlombok:lombok-mapstruct-binding:${lombokBindingVersion}"

    /** mapstruct **/
    implementation "org.mapstruct:mapstruct:${mapstructVersion}", "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}", "org.projectlombok:lombok:${lombokVersion}", "org.projectlombok:lombok-mapstruct-binding:${lombokBindingVersion}"


    /**  DATABASE  **/
    implementation 'org.hibernate:hibernate-validator:8.0.0.Final'
    implementation 'com.oracle.database.spring:oracle-spring-boot-starter-ucp:3.1.0'

    /**  JWT  **/
    implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.2'

    /**  LOGBACK  **/
    implementation 'com.github.danielwegener:logback-kafka-appender:0.2.0-RC2'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.0.1'
    implementation "ch.qos.logback.contrib:logback-jackson:0.1.5"
    implementation "ch.qos.logback.contrib:logback-json-classic:0.1.5"

    /** UTIL **/
    implementation "org.apache.commons:commons-lang3:${apacheCommTool}"
    /** swagger **/
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"


    /**  QueryDSL  **/
    implementation 'com.querydsl:querydsl-core'
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor("com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta")
    annotationProcessor("jakarta.annotation:jakarta.annotation-api")
    annotationProcessor("jakarta.persistence:jakarta.persistence-api")


    /**   Minio **/
    implementation 'io.minio:minio:8.5.17'

    /**  TEST  **/
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    /**   Minio **/
    implementation 'io.minio:minio:8.5.17'
}

tasks.named('test') {
    useJUnitPlatform()
}
